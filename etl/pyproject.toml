[project]
name = "marketpulse-etl"
version = "0.1.0"
description = "Motor ETL do MarketPulse (extração, transformação e carga de relatórios de marketplaces)."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]
